<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e1f2e">
<title>Monti · Producción diaria</title>
<style>
:root{--b:#8e1f2e;--bg:#f6f4f1;--card:#fff;--ink:#231f20;--muted:#6f6868;--line:#e7e0db;--ok:#eaf7ef;--buy:#fff5df;--warn:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}.app{max-width:760px;margin:auto;padding:14px 12px 84px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 0 12px}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{font-size:22px;margin:0;color:var(--b)}.brand small{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000008}.selector{display:grid;grid-template-columns:1fr 1fr;gap:10px}.selector label{font-size:12px;color:var(--muted);font-weight:700}.selector select,.selector input{width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:16px}.menu{border-left:5px solid var(--b)}.menu strong{display:block;font-size:18px}.menu span{color:var(--muted)}h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--b)}.row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}.row:first-of-type{border-top:0}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}.stockbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.stockbox input{width:100%;min-width:0;padding:10px 6px;border:0;font-size:16px;text-align:right;outline:none}.stockbox em{font-style:normal;font-size:11px;color:var(--muted);padding-right:7px;white-space:nowrap}.actions{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.actions button,.result button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:800}.primary{background:var(--b);color:white}.secondary{background:#eee7e3;color:#3c3433}.result{display:none}.result.show{display:block}.result pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:14px;line-height:1.45}.result .prod{background:var(--ok);border-radius:12px;padding:12px;margin:8px 0}.result .buy{background:var(--buy);border-radius:12px;padding:12px;margin:8px 0}.result .buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.warning{background:var(--warn);border:1px solid #f0cccc;color:#7d2525;border-radius:12px;padding:10px;font-size:13px;margin-top:10px}.pill{display:inline-block;background:#f0e8e5;color:#5c4442;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;margin-left:5px}@media(min-width:650px){.row{grid-template-columns:minmax(0,1fr) 120px}.app{padding-bottom:96px}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="brand"><div><h1>Monti · Producción diaria</h1><small>Mise en place · versión móvil V1</small></div><span class="pill">Agosto–Septiembre</span></div></div>
<section class="card selector">
<label>Día<select id="day"><option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option></select></label>
<label>Turno<select id="shift"><option>Día</option><option>Noche</option></select></label>
<label style="grid-column:1/-1">Fecha (opcional, para detectar día 29)<input id="date" type="date"></label>
</section>
<section class="card menu" id="menuCard"></section>
<div id="special29"></div>
<section class="card"><h2>A · Porcionado de pastas</h2><div id="pastas"></div></section>
<section class="card"><h2>B · Elaboraciones / mezclas</h2><div id="elab"></div></section>
<section class="card"><h2>C · Verduras y frescos</h2><div id="fresh"></div></section>
<section class="card result" id="result"><h2>Lista generada</h2><div class="prod"><strong>COCINA · PRODUCIR / PORCIONAR</strong><pre id="prodText"></pre></div><div class="buy"><strong>VERDULERÍA · COMPRAR</strong><pre id="buyText"></pre></div><div class="buttons"><button class="primary" id="waBtn">Enviar por WhatsApp</button><button class="secondary" id="copyBtn">Copiar texto</button></div></section>
</main>
<div class="actions"><button class="secondary" id="clearBtn">Limpiar stock</button><button class="primary" id="generateBtn">GENERAR LISTA</button></div>
<script>
const pasta={
'Lunes|Día':{noquis:18,spag:11,fus:11,mac:11,ravi:9,rav:4,las:1,sor:0},'Lunes|Noche':{noquis:25,spag:11,fus:15,mac:6,ravi:9,rav:6,las:3,sor:1},
'Martes|Día':{noquis:9,spag:11,fus:6,mac:4,ravi:5,rav:3,las:2,sor:1},'Martes|Noche':{noquis:15,spag:17,fus:10,mac:4,ravi:9,rav:2,las:4,sor:0},
'Miércoles|Día':{noquis:12,spag:7,fus:11,mac:7,ravi:10,rav:1,las:1,sor:1},'Miércoles|Noche':{noquis:25,spag:11,fus:10,mac:7,ravi:13,rav:4,las:5,sor:2},
'Jueves|Día':{noquis:28,spag:5,fus:6,mac:4,ravi:10,rav:2,las:3,sor:0},'Jueves|Noche':{noquis:39,spag:11,fus:9,mac:8,ravi:7,rav:3,las:5,sor:2},
'Viernes|Día':{noquis:14,spag:5,fus:7,mac:6,ravi:3,rav:3,las:4,sor:1},'Viernes|Noche':{noquis:16,spag:10,fus:12,mac:9,ravi:8,rav:2,las:5,sor:0}};
const menu={Lunes:{name:'Caesar Crispy',Día:6,Noche:8},Martes:{name:'Carbonara Spaghetti',Día:7,Noche:10},Miércoles:{name:'Suprema Caprese + papas',Día:13,Noche:11},Jueves:{name:'Ñoquis menú',Día:15,Noche:16},Viernes:{name:'Focacci a elección',Día:10,Noche:10}};
const rosa={'Lunes|Día':9,'Lunes|Noche':9,'Martes|Día':2,'Martes|Noche':5,'Miércoles|Día':7,'Miércoles|Noche':10,'Jueves|Día':11,'Jueves|Noche':10,'Viernes|Día':11,'Viernes|Noche':9};
const fresh={'Lunes|Día':{cherry:17,champi:150,rucula:160,lechuga:1500,morron:100},'Lunes|Noche':{cherry:34,champi:350,rucula:50,lechuga:1900,morron:100},'Martes|Día':{cherry:8,champi:50,rucula:80,lechuga:450,morron:100},'Martes|Noche':{cherry:26,champi:150,rucula:150,lechuga:550,morron:250},'Miércoles|Día':{cherry:9,champi:100,rucula:80,lechuga:300,morron:100},'Miércoles|Noche':{cherry:29,champi:350,rucula:100,lechuga:550,morron:200},'Jueves|Día':{cherry:5,champi:50,rucula:0,lechuga:300,morron:100},'Jueves|Noche':{cherry:27,champi:250,rucula:100,lechuga:550,morron:150},'Viernes|Día':{cherry:10,champi:100,rucula:40,lechuga:750,morron:100},'Viernes|Noche':{cherry:28,champi:350,rucula:50,lechuga:200,morron:200}};
const pastaRows=[['noquis','Ñoquis','porc.'],['spag','Spaghetti / Tallarín','porc.'],['fus','Fusilli','porc.'],['mac','Macarrón','porc.'],['ravi','Ravioles','porc.'],['rav','Raviolón','porc.'],['las','Lasagna','porc.'],['sor','Sorrentino','porc.']];
const freshRows=[['cherry','Tomate cherry','u'],['champi','Champiñones','g'],['rucula','Rúcula','g'],['lechuga','Lechuga lavada y cortada','g'],['morron','Morrón para salteado','g']];
function elabFor(day,shift){const q=menu[day][shift],r=rosa[day+'|'+shift];let a=[{id:'rosa',name:'Salsa Rosa a mezclar',target:r,unit:'porc.',note:'220 g c/u · 40% Tuco + 60% Blanca'}];if(day==='Lunes')a.push({id:'pollo',name:'Pollo crispy',target:q,unit:'porc.'},{id:'croutons',name:'Croutons',target:q,unit:'porc.'});if(day==='Martes')a.push({id:'carbonara',name:'Crema de panceta + cebolla',target:q,unit:'porc.'},{id:'panceta',name:'Panceta porcionada',target:q,unit:'porc.'},{id:'queso',name:'Queso terminación',target:q,unit:'porc.'});if(day==='Miércoles')a.push({id:'suprema',name:'Supremas',target:q,unit:'u'},{id:'caprese',name:'Preparación Caprese',target:q,unit:'porc.'},{id:'muzza',name:'Muzzarella porcionada',target:q,unit:'porc.'},{id:'papas',name:'Papas guarnición',target:q,unit:'porc.'});if(day==='Viernes')a.push({id:'focaccia',name:'Pan focaccia menú',target:q,unit:'u'},{id:'relleno',name:'Rellenos focacci porcionados',target:q,unit:'porc.'},{id:'papas',name:'Papas guarnición',target:q,unit:'porc.'});return a}
function key(){return day.value+'|'+shift.value}function storeKey(id){return 'monti-mise:'+key()+':'+id}
function rowHTML(id,name,target,unit,note=''){const saved=localStorage.getItem(storeKey(id))??'';return `<div class="row"><div><div class="name">${name}</div><div class="meta">Objetivo: <b>${target}</b> ${unit}${note?' · '+note:''}</div></div><div class="stockbox"><input inputmode="decimal" type="number" min="0" step="any" data-id="${id}" data-target="${target}" data-unit="${unit}" value="${saved}" placeholder="0"><em>${unit}</em></div></div>`}
function render(){const d=day.value,s=shift.value,k=key(),q=menu[d][s];menuCard.innerHTML=`<strong>${d} · ${s}</strong><span>Menú: ${menu[d].name} · objetivo ${q} platos</span>`;const dt=date.value?new Date(date.value+'T12:00:00'):null;special29.innerHTML=dt&&dt.getDate()===29?'<div class="warning"><b>DÍA 29:</b> el objetivo normal de ñoquis no debe usarse sin validar la producción especial del 29.</div>':'';pastas.innerHTML=pastaRows.filter(x=>pasta[k][x[0]]>0).map(([id,n,u])=>rowHTML('p-'+id,n,pasta[k][id],u,'objetivo de apertura')).join('');elab.innerHTML=elabFor(d,s).map(x=>rowHTML('e-'+x.id,x.name,x.target,x.unit,x.note||'')).join('');fresh.innerHTML=freshRows.filter(x=>fresh[k][x[0]]>0).map(([id,n,u])=>rowHTML('f-'+id,n,fresh[k][id],u,s==='Noche'?'incluye cobertura nocturna':'compra fina del turno')).join('');bindInputs();result.classList.remove('show')}
function bindInputs(){document.querySelectorAll('input[data-id]').forEach(i=>i.addEventListener('input',()=>localStorage.setItem(storeKey(i.dataset.id),i.value)))}
function diffLine(i){const target=Number(i.dataset.target||0),stock=Number(i.value||0),need=Math.max(0,target-stock);return {need,unit:i.dataset.unit,id:i.dataset.id,name:i.closest('.row').querySelector('.name').textContent}}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(2).replace('.',',')}
function generate(){const prod=[],buy=[];document.querySelectorAll('input[data-id]').forEach(i=>{const x=diffLine(i);if(x.need<=0)return;if(x.id.startsWith('f-'))buy.push(`• ${x.name}: ${fmt(x.need)} ${x.unit}`);else if(x.id==='e-rosa'){const kg=x.need*.220,tuco=kg*.4,blanca=kg*.6;prod.push(`• Rosa: ${fmt(x.need)} porc. (${fmt(kg)} kg) → Tuco ${fmt(tuco)} kg + Blanca ${fmt(blanca)} kg`)}else prod.push(`• ${x.name}: ${fmt(x.need)} ${x.unit}`)});prodText.textContent='\n'+(prod.length?prod.join('\n'):'✓ Sin producción pendiente');buyText.textContent='\n'+(buy.length?buy.join('\n'):'✓ Sin compra pendiente');result.classList.add('show');const header=`MONTI — PRODUCCIÓN ${day.value.toUpperCase()} ${shift.value.toUpperCase()}\nMenú: ${menu[day.value].name}\n`;window.generated=header+'\nCOCINA — PRODUCIR / PORCIONAR\n'+(prod.length?prod.join('\n'):'✓ Sin producción pendiente')+'\n\nVERDULERÍA — COMPRAR\n'+(buy.length?buy.join('\n'):'✓ Sin compra pendiente');result.scrollIntoView({behavior:'smooth',block:'start'})}
day.addEventListener('change',render);shift.addEventListener('change',render);date.addEventListener('change',render);generateBtn.addEventListener('click',generate);clearBtn.addEventListener('click',()=>{if(confirm('¿Limpiar el stock cargado de este turno?')){document.querySelectorAll('input[data-id]').forEach(i=>{i.value='';localStorage.removeItem(storeKey(i.dataset.id))});result.classList.remove('show')}});waBtn.addEventListener('click',()=>{if(!window.generated)generate();location.href='https://wa.me/?text='+encodeURIComponent(window.generated)});copyBtn.addEventListener('click',async()=>{if(!window.generated)generate();await navigator.clipboard.writeText(window.generated);copyBtn.textContent='Copiado ✓';setTimeout(()=>copyBtn.textContent='Copiar texto',1500)});
const today=new Date();const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];if(['Lunes','Martes','Miércoles','Jueves','Viernes'].includes(days[today.getDay()]))day.value=days[today.getDay()];shift.value=today.getHours()>=17||today.getHours()<3?'Noche':'Día';date.value=today.toISOString().slice(0,10);render();
</script></body></html>
